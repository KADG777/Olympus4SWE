[project]
name = "olympus-key-ledger"
version = "0.1.0"
description = "Local LLM API key rotation proxy and usage ledger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "starlette>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
key-ledger = "key_ledger.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "types-pyyaml>=6.0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/key_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
